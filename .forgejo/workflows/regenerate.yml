name: Regenerate Changelog and Release Files

on:
  push:
    branches:
      - master

jobs:
  regenerate-changelog:
    runs-on: codeberg-tiny
    outputs:
      latest_tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            CHANGELOG.md

      - name: Install git-cliff
        run: |
          curl -L "https://github.com/orhun/git-cliff/releases/download/v2.12.0/git-cliff-2.12.0-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
          tar -xzf git-cliff.tar.gz --strip-components=1
          chmod +x git-cliff
          mv git-cliff /usr/local/bin/
          git-cliff --version

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "Latest tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate CHANGELOG.md
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          git-cliff -o CHANGELOG.md

      - name: Commit and push changelog
        env:
          GIT_AUTHOR_NAME: "forgejo-actions"
          GIT_AUTHOR_EMAIL: "forgejo-actions@users.noreply.local"
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(changelog): regenerate data"
          git push

  regenerate-release-files:
    runs-on: codeberg-tiny
    needs: regenerate-changelog
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            dist/release/
            themes/

      - name: Create zip archives for themes
        run: |
          mkdir -p dist/release
          THEMES=(mocha macchiato frappe latte)
          for theme in "${THEMES[@]}"; do
            zip -r "dist/release/${theme}.zip" "themes/$theme"
            echo "Archived $theme to dist/release/${theme}.zip"
          done

      - name: Commit and push release files
        env:
          GIT_AUTHOR_NAME: "forgejo-actions"
          GIT_AUTHOR_EMAIL: "forgejo-actions@users.noreply.local"
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          git add dist/release/*
          git diff --cached --quiet || git commit -m "chore(release files): update for ${{ needs.regenerate-changelog.outputs.latest_tag }}"
          git push origin master
