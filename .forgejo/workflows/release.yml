name: Create Release

on:
  push:
    tags:
      - "*" # triggers on any tag push

jobs:
  release:
    runs-on: codeberg-small
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip python3 python3-yaml

      - name: Install Nix
        run: |
          curl -L https://nixos.org/nix/install | sh -s -- --daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version

      - name: Install git-cliff
        run: |
          curl -L "https://github.com/orhun/git-cliff/releases/download/v2.12.0/git-cliff-2.12.0-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
          tar -xzf git-cliff.tar.gz --strip-components=1
          chmod +x git-cliff
          mv git-cliff /usr/local/bin/
          git-cliff --version

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "Latest tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create zip files for themes
        run: |
          THEMES=(mocha macchiato frappe latte)
          for theme in "${THEMES[@]}"; do
            zip -r "${theme}.zip" "themes/$theme"
          done

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0)
          PREV_TAG=$(git describe --tags --abbrev=0 $LATEST_TAG^)
          git-cliff --tag "$PREV_TAG..$LATEST_TAG" > changelog.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release via API
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          CHANGELOG_FILE="${TAG}-changelog.md"
          echo "${{ steps.changelog.outputs.changelog }}" > "$CHANGELOG_FILE"

          JSON=$(python3 -c "import json; print(json.dumps({
            'tag_name': '$TAG',
            'name': '$TAG',
            'body': open('$CHANGELOG_FILE').read(),
            'draft': False,
            'prerelease': False
          }))")

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            https://codeberg.org/api/v1/repos/scarcekoi/pride-flags/releases)

          echo "$RESPONSE"

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$RELEASE_ID" ]; then
            echo "Release creation failed"
            exit 1
          fi

          for FILE in mocha.zip macchiato.zip frappe.zip latte.zip flag_zips/*.zip; do
            if [[ -f "$FILE" ]]; then
              curl -X POST \
                -H "Authorization: token $FORGEJO_TOKEN" \
                -F "attachment=@$FILE" \
                "https://codeberg.org/api/v1/repos/scarcekoi/pride-flags/releases/$RELEASE_ID/assets"
            else
              echo "File not found: $FILE"
            fi
          done
