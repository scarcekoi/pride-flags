name: Create Release

on:
  push:
    tags:
      - "*" # triggers on any tag push

jobs:
  release:
    runs-on: codeberg-small
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            dist/release
            resources/flags.yml
            themes/

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip python3 python3-yaml

      - name: Install git-cliff
        run: |
          curl -L "https://github.com/orhun/git-cliff/releases/download/v2.12.0/git-cliff-2.12.0-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
          tar -xzf git-cliff.tar.gz --strip-components=1
          chmod +x git-cliff
          mv git-cliff /usr/local/bin/
          git-cliff --version

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "Latest tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create archives for themes and flags
        run: |
          mkdir -p dist/release

          THEMES=(mocha macchiato frappe latte)

          # Create theme archives (mocha.zip, etc.)
          for theme in "${THEMES[@]}"; do
            zip -r "dist/release/${theme}.zip" "themes/$theme"/*
            echo "Created theme archive: dist/release/${theme}.zip"
          done

          # Read flags from resources/flags.yml
          FLAGS=$(yq -r '.flags | keys[]' resources/flags.yml)

          # Create flag archives (transgender.zip, etc.)
          for flag in $FLAGS; do
            ZIP_FILE="dist/release/${flag}.zip"
            rm -f "$ZIP_FILE"

            for theme in "${THEMES[@]}"; do
              THEME_FLAG_DIR="themes/$theme/$flag"
              if [[ -d "$THEME_FLAG_DIR" ]]; then
                # Add the flag folder under the theme folder inside the zip
                zip -r "$ZIP_FILE" "$THEME_FLAG_DIR" -x "*.DS_Store" -j
                zipnote -w "$ZIP_FILE" <<< "@ $theme/"
              fi
            done
            echo "Created flag archive: $ZIP_FILE"
          done

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0)
          PREV_TAG=$(git tag --sort=-creatordate | grep -B1 "^$LATEST_TAG$" | head -n1)
          git-cliff --tag "$PREV_TAG..$LATEST_TAG" > changelog.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release via Forgejo Action
        uses: forgejo-actions/forgejo-release@v1
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          tag: ${{ steps.get_tag.outputs.tag }}
          name: ${{ steps.get_tag.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          assets: |
            dist/release/mocha.zip
            dist/release/macchiato.zip
            dist/release/frappe.zip
            dist/release/latte.zip
