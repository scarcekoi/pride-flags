---
name: Lint PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch: null

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Whiskers
        uses: catppuccin/setup-whiskers@v2
      - name: Check Whiskers Templates
        run: whiskers . --check
      - name: Install formatters
        run: |
          pip install yamlfix[preserve-quotes] taplo-cli mdformat
      - name: Check YAML formatting
        run: |
          yamlfix --preserve-quotes --check --exclude '.github/**' \
            $(find . -name '*.yml' -o -name '*.yaml' | grep -v '.github/')
      - name: Check TOML formatting
        run: |
          taplo format --check \
            $(find . -name '*.toml' | grep -v '.github/')
      - name: Check Markdown formatting
        run: |
          mdformat --check --wrap 100 \
            $(find . -name '*.md' -not -path './.github/**')
      - uses: astral-sh/setup-uv@v7
      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Cache mypy
        uses: actions/cache@v5
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml', 'scripts/build.py') }}
          restore-keys: ${{ runner.os }}-mypy-
      - name: Install dependencies
        run: uv sync
      - name: Format check
        run: uv run ruff format --check scripts/
      - name: Lint check
        run: uv run ruff check scripts/
      - name: Type check
        run: uv run mypy scripts/build.py
