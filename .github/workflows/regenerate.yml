---
name: Regenerate Changelog
on:
  push:
    branches: [main]
jobs:
  regenerate-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: |
          curl -L "https://github.com/orhun/git-cliff/releases/download/v2.12.0/git-cliff-2.12.0-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
          tar -xzf git-cliff.tar.gz --strip-components=1
          chmod +x git-cliff
          sudo mv git-cliff /usr/local/bin/
      - name: Generate CHANGELOG.md
        run: git-cliff -o CHANGELOG.md
      - name: Commit and push changelog
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(changelog): regenerate data"
          git push
