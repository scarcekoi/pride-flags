---
name: Build & Release

on:
  workflow_run:
    workflows: [Prepare]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache build artifacts
        id: cache-build
        uses: actions/cache@v5
        with:
          path: dist/
          key: ${{ runner.os }}-build-${{ hashFiles('templates/**', 'themes/**', 'scripts/build.py') }}
          restore-keys: ${{ runner.os }}-build-
      - name: Set up Python
        if: steps.cache-build.outputs.cache-hit != true
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache npm
        if: steps.cache-build.outputs.cache-hit != true
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-svgo
          restore-keys: ${{ runner.os }}-npm-
      - name: Cache uv
        if: steps.cache-build.outputs.cache-hit != true
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Cache Playwright
        if: steps.cache-build.outputs.cache-hit != true
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-playwright-chromium-
      - name: Install system deps
        if: steps.cache-build.outputs.cache-hit != true
        run: |-
          sudo apt-get update
          sudo apt-get install -y flatpak imagemagick jpegoptim optipng xz-utils
          npm install -g svgo
      - name: Install libresprite
        if: steps.cache-build.outputs.cache-hit != true
        run: |-
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub com.github.libresprite.LibreSprite
          sudo tee /usr/local/bin/libresprite > /dev/null <<'EOF'
          #!/bin/bash
          flatpak run com.github.libresprite.LibreSprite "$@"
          EOF
          sudo chmod +x /usr/local/bin/libresprite
      - name: Setup Whiskers
        if: steps.cache-build.outputs.cache-hit != true
        uses: catppuccin/setup-whiskers@v2
      - name: Setup Catwalk
        if: steps.cache-build.outputs.cache-hit != true
        uses: catppuccin/setup-catwalk@v1
      - name: Install uv
        if: steps.cache-build.outputs.cache-hit != true
        uses: astral-sh/setup-uv@v7
      - name: Install Python deps
        if: steps.cache-build.outputs.cache-hit != true
        run: uv sync
      - name: Install Playwright browsers
        if: steps.cache-build.outputs.cache-hit != true
        run: uv run python -m playwright install --with-deps chromium
      - name: Run build pipeline
        if: steps.cache-build.outputs.cache-hit != true
        run: uv run python scripts/build.py all
      - name: Upload flag artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pride-flags
          path: dist/flags/
          retention-days: 30
      - name: Upload flavour artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pride-flavours
          path: dist/flavours/
          retention-days: 30
  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: pride-flags
          path: dist/flags/
      - uses: actions/download-artifact@v8
        with:
          name: pride-flavours
          path: dist/flavours/
      - name: Get tag name
        id: tag
        run: |-
          VERSION=$(awk -F'"' '/version = / {gsub(/[[:space:]]/, "", $2); print $2}' pyproject.toml)
          TAG="v$VERSION"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/flags/*
            dist/flavours/*
          draft: false
          generate_release_notes: true
          tag_name: ${{ steps.tag.outputs.tag_name }}
          body: |-
            ## 🚩 Flags
            Download individual flag `.tar.xz` files as needed:
            - `flags_mocha.tar.xz`
            - `flags_latte.tar.xz`
            - etc.

            ## 🎨 Flavours
            Download individual flavour `.tar.xz` files as needed:
            - `flavours_mocha.tar.xz`
            - `flavours_latte.tar.xz`
            - etc.
