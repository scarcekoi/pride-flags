---
name: Prepare

on:
  push:
    branches: [main]
  workflow_dispatch: null

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v5
        id: cache-uv
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-
      - run: uv sync --all-extras
        if: steps.cache-uv.outputs.cache-hit != true
      - run: uv run yamllint  $(find . -name '*.yml' -o -name '*.yaml' | grep -v '.github/')
      - run: uv run ruff check scripts/build.py
      - run: uv run mypy scripts/build.py
  prepare:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.create-tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@git-cliff
      - uses: taiki-e/install-action@taplo
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-
      - run: uv sync --all-extras
      - run: git-cliff -v -o CHANGELOG.md
      - run: uv run yamlfix . --exclude=".github/**"
      - run: taplo format $(find . -name '*.toml' | grep -v '.github/')
      - run: uv run mdformat .
      - run: uv run ruff format scripts/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/**'
          git commit -m "chore: changelog and style formatting [skip ci]" || true
      - run: |
          VERSION=$(awk -F'"' '/version = / {gsub(/[[:space:]]/, "", $2); print $2; exit}' pyproject.toml)
          TAG="v$VERSION"
          git tag -f "$TAG"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
        id: create-tag
      - run: git push -f origin main
      - run: git push -f origin ${{ steps.create-tag.outputs.tag_name }}
