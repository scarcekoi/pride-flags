name: Colour Change
description: Request a colour change for an existing flag
body:
  - id: name
    type: input
    attributes:
      label: Name of the flag
      description: What is the name of the flag?
      placeholder: Femboy...
    validations:
      required: true
  - id: change
    type: textarea
    attributes:
      label: The Change
      description: What colour(s) you want changed in the flag.
    validations:
      required: true
